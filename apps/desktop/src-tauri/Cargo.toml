[package]
name = "chatfire-canvas-desktop"
version = "2.0.0"
description = "火宝画布桌面端（Tauri 壳，前端复用 apps/web）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "chatfire_canvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
# unsafe-headers：desktopBridge 需覆写 Origin 为目标自身 origin（严格 CORS 网关白名单语义）
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
