appId: site.chatfire.canvas
productName: HuobaoCanvas
directories:
  output: release
  buildResources: assets
# 主进程/preload 产物 + 内嵌 server bundle + 清单（进入 asar）。
# server.mjs 无原生依赖（node:sqlite 为内置模块），无需 asarUnpack / npmRebuild。
files:
  - dist/**
  - build/server.mjs
  - package.json
extraResources:
  - { from: resources/frontend, to: frontend }
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # 应用内更新器用的 zip 产物（.app 目录归档），与 dmg 一并产出
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # 先出未签名包：正式分发需 Apple Developer 签名 + notarize（配置位已留）
  identity: null
  icon: icon.icns
win:
  target:
    - target: nsis
      arch: [x64]
  # signExecutable:false 仅跳过签名（未签名分发 SmartScreen 会提示），
  # 图标与版本信息仍会写入 exe；正式分发需代码签名证书
  signExecutable: false
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: 火宝画布
