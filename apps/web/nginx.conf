server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 推理上游反代（浏览器同源访问，规避 CORS）
    # /v1beta 必须排在 /v1 之前
    location /v1beta/ { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    location /v1/     { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    location /volcengine/ { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    location /qwen/       { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    location /vidu/       { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    location /minimax/    { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    location /xai/        { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    location /zhipu/      { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }
    # 模型目录（ChatFire 网关公开只读接口）
    location /sys/model/ { proxy_pass ${UPSTREAM}; include /etc/nginx/proxy_common.conf; }

    # ── 厂商官方 API 直连反代 ──
    # 变量形式 proxy_pass + 运行时 resolver：避免启动时缓存被本机代理 fake-ip 污染的 DNS 结果
    # （set 必须先于 rewrite...break 声明）
    location /official/openai/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_openai https://api.openai.com;
        rewrite ^/official/openai(/.*)$ $1 break;
        proxy_pass $up_openai; include /etc/nginx/proxy_common.conf;
    }
    location /official/anthropic/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_anthropic https://api.anthropic.com;
        rewrite ^/official/anthropic(/.*)$ $1 break;
        proxy_pass $up_anthropic; include /etc/nginx/proxy_common.conf;
    }
    location /official/gemini/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_gemini https://generativelanguage.googleapis.com;
        rewrite ^/official/gemini(/.*)$ $1 break;
        proxy_pass $up_gemini; include /etc/nginx/proxy_common.conf;
    }
    location /official/qwen/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_qwen https://dashscope.aliyuncs.com;
        rewrite ^/official/qwen(/.*)$ $1 break;
        proxy_pass $up_qwen; include /etc/nginx/proxy_common.conf;
    }
    location /official/volcengine/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_volcengine https://ark.cn-beijing.volces.com;
        rewrite ^/official/volcengine(/.*)$ $1 break;
        proxy_pass $up_volcengine; include /etc/nginx/proxy_common.conf;
    }
    location /official/deepseek/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_deepseek https://api.deepseek.com;
        rewrite ^/official/deepseek(/.*)$ $1 break;
        proxy_pass $up_deepseek; include /etc/nginx/proxy_common.conf;
    }
    location /official/minimax/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_minimax https://api.minimaxi.com;
        rewrite ^/official/minimax(/.*)$ $1 break;
        proxy_pass $up_minimax; include /etc/nginx/proxy_common.conf;
    }
    location /official/moonshot/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_moonshot https://api.moonshot.cn;
        rewrite ^/official/moonshot(/.*)$ $1 break;
        proxy_pass $up_moonshot; include /etc/nginx/proxy_common.conf;
    }
    location /official/zhipu/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_zhipu https://open.bigmodel.cn;
        rewrite ^/official/zhipu(/.*)$ $1 break;
        proxy_pass $up_zhipu; include /etc/nginx/proxy_common.conf;
    }
    location /official/xai/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_xai https://api.x.ai;
        rewrite ^/official/xai(/.*)$ $1 break;
        proxy_pass $up_xai; include /etc/nginx/proxy_common.conf;
    }
    location /official/vidu/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_vidu https://api.vidu.cn;
        rewrite ^/official/vidu(/.*)$ $1 break;
        proxy_pass $up_vidu; include /etc/nginx/proxy_common.conf;
    }
    location /official/xiaomi/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $up_xiaomi https://api.xiaomimimo.com;
        rewrite ^/official/xiaomi(/.*)$ $1 break;
        proxy_pass $up_xiaomi; include /etc/nginx/proxy_common.conf;
    }

    # 可选媒体存储服务（docker compose --profile storage）
    # 注意：set 必须在 rewrite...break 之前（break 会中止后续 rewrite 模块指令）
    location /storage/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $storage_upstream ${STORAGE_UPSTREAM};
        rewrite ^/storage(/.*)$ $1 break;
        proxy_pass $storage_upstream;
        include /etc/nginx/proxy_common.conf;
        client_max_body_size 150m;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html / config.js 不缓存（保证发版后立即生效）；带 hash 的静态资源长缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
