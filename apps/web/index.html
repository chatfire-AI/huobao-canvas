<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>火宝画布</title>
    <link rel="icon" type="image/png" href="/icons/huobao.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Inter 可变字重（与 gateway platform 同一来源；离线/桌面端自动回退系统栈） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet" />
    <!-- 部署时注入的运行时配置（可选，见 docker-entrypoint 30-app-config.sh） -->
    <script src="/config.js"></script>
    <!-- 首帧前定主题，避免浅色闪屏：默认暗色，仅用户显式选过浅色才用浅色 -->
    <script>
      if (localStorage.getItem('chatfire-theme') !== 'light') {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
