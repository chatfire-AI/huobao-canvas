services:
  web:
    build: ./apps/web
    ports:
      - "8080:80"
    # 显式公共 DNS：规避本机代理（Clash 等）fake-ip 污染容器内 nginx 上游解析。
    # 海外厂商（openai/xai/anthropic/gemini）若需走本机代理，请移除这两行改用宿主机 DNS。
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      # 推理上游：默认 ChatFire 公共 API，可改为任意 OpenAI 兼容网关
      UPSTREAM: ${UPSTREAM:-https://api.chatfire.site}
      # 浏览器侧请求基地址：默认空串（同源，走 nginx 反代）
      API_BASE_URL: ${API_BASE_URL:-}
      # 画布存储服务（SQLite）
      CANVAS_SERVER: http://server:16812
    restart: unless-stopped

  # 画布存储 + 运行引擎：SQLite 持久化 + 全量模型调用服务端执行（runs 队列）
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 16812
      DATA_DIR: /data
    volumes:
      - canvas-data:/data
    restart: unless-stopped

volumes:
  canvas-data:
